<div>
  <div class="spinner" *ngIf="loading"></div>

  <div class="alert alert-error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="card" *ngIf="!loading && blog">
    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
      <div>
        <h2>{{ blog.title }}</h2>
        <div class="meta">
          <span>By {{ getAuthorName() }}</span>
          <span> | </span>
          <span>{{ blog.publishedAt ? (blog.publishedAt | date: 'medium') : (blog.createdAt | date: 'medium') }}</span>
          <span> | </span>
          <span class="status-badge" [class.published]="blog.status === 'published'" [class.draft]="blog.status === 'draft'">
            {{ blog.status }}
          </span>
        </div>
      </div>
      <div *ngIf="isAuthor" style="display: flex; gap: 0.5rem;">
        <button class="btn btn-primary" (click)="editBlog()">Edit</button>
        <button class="btn btn-danger" (click)="deleteBlog()">Delete</button>
      </div>
    </div>

    <div class="tags" *ngIf="blog.tags && blog.tags.length > 0">
      <span class="tag" *ngFor="let tag of blog.tags">{{ tag }}</span>
    </div>

    <div class="content">
      {{ blog.content }}
    </div>

    
  </div>
</div>

<button class="btn btn-primary" (click)="goBack()" style="float: right;">
      Back to Blogs
    </button>
