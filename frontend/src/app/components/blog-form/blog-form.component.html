<div class="card">
  <h2>{{ isEditMode ? 'Edit Blog' : 'Create New Blog' }}</h2>
  
  <div class="alert alert-success" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <div class="alert alert-error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <form [formGroup]="blogForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Title *</label>
      <input
        type="text"
        id="title"
        formControlName="title"
        placeholder="Enter blog title"
        [class.error]="blogForm.get('title')?.invalid && blogForm.get('title')?.touched"
      >
      <div class="error-message" *ngIf="blogForm.get('title')?.invalid && blogForm.get('title')?.touched">
        <small *ngIf="blogForm.get('title')?.errors?.['required']">Title is required</small>
        <small *ngIf="blogForm.get('title')?.errors?.['minlength']">Title must be at least 3 characters</small>
      </div>
    </div>

    <div class="form-group">
      <label for="summary">Summary</label>
      <input
        type="text"
        id="summary"
        formControlName="summary"
        placeholder="Enter a brief summary (optional)"
      >
    </div>

    <div class="form-group">
      <label for="content">Content *</label>
      <textarea
        id="content"
        formControlName="content"
        placeholder="Write your blog content here..."
        rows="10"
        [class.error]="blogForm.get('content')?.invalid && blogForm.get('content')?.touched"
      ></textarea>
      <div class="error-message" *ngIf="blogForm.get('content')?.invalid && blogForm.get('content')?.touched">
        <small *ngIf="blogForm.get('content')?.errors?.['required']">Content is required</small>
        <small *ngIf="blogForm.get('content')?.errors?.['minlength']">Content must be at least 10 characters</small>
      </div>
    </div>

    <div class="form-group">
      <label for="tags">Tags (comma-separated)</label>
      <input
        type="text"
        id="tags"
        formControlName="tags"
        placeholder="e.g., technology, programming, web development"
      >
    </div>

    <div class="form-group">
      <label for="status">Status *</label>
      <select id="status" formControlName="status">
        <option value="draft">Draft</option>
        <option value="published">Published</option>
        <option value="archived">Archived</option>
      </select>
    </div>

    <div style="display: flex; gap: 1rem;">
      <button type="submit" class="btn btn-primary" [disabled]="blogForm.invalid || loading">
        {{ loading ? 'Saving...' : (isEditMode ? 'Update Blog' : 'Create Blog') }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="loading">
        Cancel
      </button>
    </div>
  </form>
</div>
