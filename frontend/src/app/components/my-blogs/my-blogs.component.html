<div>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <h2>My Blogs</h2>
    <button class="btn btn-success" (click)="createBlog()">Create New Blog</button>
  </div>

  <div class="filter-bar" style="margin-bottom: 1.5rem;">
    <label for="statusFilter">Filter by status: </label>
    <select id="statusFilter" [(ngModel)]="filterStatus" (change)="onFilterChange()">
      <option value="">All</option>
      <option value="draft">Draft</option>
      <option value="published">Published</option>
      <option value="archived">Archived</option>
    </select>
  </div>

  <div class="spinner" *ngIf="loading"></div>

  <div class="alert alert-error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="blog-list" *ngIf="!loading && blogs.length > 0">
    <div class="blog-item" *ngFor="let blog of blogs">
      <div style="display: flex; justify-content: space-between; align-items: start;">
        <div style="flex: 1;">
          <h3>{{ blog.title }}</h3>
          <div class="meta">
            <span>{{ blog.createdAt | date: 'medium' }}</span>
            <span> | </span>
            <span class="status-badge" [class.published]="blog.status === 'published'" 
                  [class.draft]="blog.status === 'draft'" 
                  [class.archived]="blog.status === 'archived'">
              {{ blog.status }}
            </span>
          </div>
          <p class="summary" *ngIf="blog.summary">{{ blog.summary }}</p>
          <div class="tags" *ngIf="blog.tags && blog.tags.length > 0">
            <span class="tag" *ngFor="let tag of blog.tags">{{ tag }}</span>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" (click)="viewBlog(blog.id)">View</button>
        <button class="btn btn-primary" (click)="editBlog(blog.id)">Edit</button>
        <button class="btn btn-danger" (click)="deleteBlog(blog.id)">Delete</button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && blogs.length === 0">
    <p style="text-align: center; color: #7f8c8d; padding: 2rem;">
      You haven't created any blogs yet. Start writing!
    </p>
  </div>

  <div class="pagination" *ngIf="!loading && totalPages > 1">
    <button (click)="previousPage()" [disabled]="currentPage === 1">Previous</button>
    <span>Page {{ currentPage }} of {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="currentPage === totalPages">Next</button>
  </div>
</div>
